name: build-siboot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build siboot for Open Minis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build siboot binary
        working-directory: minis
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Locate and prepare binary
        run: |
          find . -name siboot -type f -perm /111
          mkdir -p bin_out
          find . -path "*/release/siboot" -exec cp {} bin_out/siboot \;

      - name: Upload siboot artifact
        uses: actions/upload-artifact@v4
        with:
          name: siboot-aarch64
          path: bin_out/siboot
          if-no-files-found: error
